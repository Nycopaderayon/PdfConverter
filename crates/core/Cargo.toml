[package]
name = "pdfword-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Conversion engine for pdfword: PDF to DOCX and DOCX to PDF"

[dependencies]
docx-rs = "0.4.22"
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "thread_safe", "image_latest"] }
tempfile = "3"
thiserror.workspace = true
wait-timeout = "0.2"
